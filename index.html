<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포피플 활동내역 관리</title>
<style>
  :root{
    --navy:#142850;
    --navy-2:#1e3a66;
    --teal:#2E8B84;
    --teal-light:#e4f2f0;
    --amber:#E2A63B;
    --amber-light:#fbf1de;
    --rose:#C1524B;
    --rose-light:#fbe9e8;
    --indigo:#5B5FC7;
    --olive:#8C7A3B;
    --slate:#57606f;
    --bg:#F3F5F8;
    --card:#FFFFFF;
    --line:#E4E8EE;
    --ink:#1F2430;
    --ink-muted:#6B7280;
    --radius:14px;
    --mono: 'SFMono-Regular', ui-monospace, 'JetBrains Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:#D9DDE3;
    color:var(--ink);
    font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);
    max-width:480px;
    margin:0 auto;
    position:relative;
  }
  @media (min-width:520px){
    body{ padding:28px 0; }
    #app{
      min-height:calc(100vh - 56px);
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(20,40,80,0.18);
      border:1px solid rgba(20,40,80,0.08);
    }
  }

  /* top bar */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-0.02em;font-size:16px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(46,139,132,0.25);}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;}
  .tab-btn{
    background:transparent;border:none;color:rgba(255,255,255,0.65);
    padding:8px 14px;border-radius:20px;font-size:13.5px;cursor:pointer;
    font-weight:600;transition:all .15s;
  }
  .tab-btn:hover{color:#fff;background:rgba(255,255,255,0.08);}
  .tab-btn.active{background:#fff;color:var(--navy);}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,0.8);}
  .who b{color:#fff;}
  .logout-btn{
    background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;
    padding:6px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.2);}
  .hamburger-btn{
    background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:16px;
    width:36px;height:36px;border-radius:8px;cursor:pointer;flex-shrink:0;
  }
  .hamburger-btn:hover{background:rgba(255,255,255,0.2);}

  .sidebar-backdrop{
    position:absolute;inset:0;background:rgba(15,20,35,0.45);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .sidebar-backdrop.open{opacity:1;pointer-events:auto;}
  .sidebar{
    position:absolute;top:0;left:0;bottom:0;width:250px;background:#fff;z-index:41;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:2px 0 20px rgba(0,0,0,0.15);overflow-y:auto;padding:10px 0 20px;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-head{
    display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:800;color:var(--navy);
    border-bottom:1px solid var(--line);margin-bottom:6px;
  }
  .sidebar-head .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);}
  .sidebar-head .close-x{margin-left:auto;color:var(--ink-muted);}
  .side-group-label{
    padding:16px 16px 6px;font-size:14.5px;font-weight:800;color:var(--navy);
    letter-spacing:.01em;
  }
  .side-item{
    display:block;width:100%;text-align:left;background:transparent;border:none;
    padding:10px 20px;font-size:14px;color:var(--ink);cursor:pointer;font-weight:600;
  }
  .side-item:hover{background:#F3F5F8;}
  .side-item.active{background:var(--teal-light);color:#1f5f59;font-weight:700;}

  main{flex:1;padding:18px 14px 70px;width:100%;margin:0 auto;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .card h2{margin:0 0 4px;font-size:16px;letter-spacing:-0.01em;}
  .card .sub{color:var(--ink-muted);font-size:12.5px;margin-bottom:14px;}

  .grid2{display:grid;grid-template-columns:1fr;gap:14px;}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-muted);margin:12px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=tel],input[type=password],input[type=date],input[type=datetime-local],input[type=file],select,textarea{
    width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;
    font-family:inherit;background:#FAFBFC;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;background:#fff;}
  textarea{resize:vertical;min-height:90px;line-height:1.5;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--navy);color:#fff;border:none;padding:12px 18px;min-height:46px;border-radius:10px;
    font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;
  }
  .btn:hover{opacity:0.9;}
  .btn:active{transform:scale(0.98);}
  .btn.teal{background:var(--teal);}
  .btn.amber{background:var(--amber);color:#3a2c05;}
  .btn.rose{background:var(--rose);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn.sm{padding:8px 14px;min-height:38px;font-size:13px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.pending{background:var(--amber-light);color:#8a6417;}
  .badge.approved{background:var(--teal-light);color:#1f5f59;}
  .badge.rejected{background:var(--rose-light);color:#8a2f2a;}
  .badge.visit{background:var(--teal-light);color:#1f5f59;}
  .badge.callback{background:var(--amber-light);color:#8a6417;}
  .badge.declined{background:var(--rose-light);color:#8a2f2a;}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;}
  table{width:100%;min-width:480px;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--ink-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
     padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .muted{color:var(--ink-muted);}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-muted);font-size:13.5px;}

  /* progress ring */
  .ring-wrap{display:flex;align-items:center;gap:18px;}
  .ring-num{font-family:var(--mono);}
  .ring-num .big{font-size:30px;font-weight:700;color:var(--navy);}
  .ring-num .small{font-size:13px;color:var(--ink-muted);}

  /* auth screens */
  .auth-shell{max-width:420px;margin:60px auto;padding:0 16px;}
  .auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 28px;}
  .auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-weight:800;font-size:19px;color:var(--navy);}
  .auth-logo .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);}
  .auth-sub{color:var(--ink-muted);font-size:13px;margin-bottom:22px;}
  .switch-line{margin-top:16px;font-size:13px;color:var(--ink-muted);text-align:center;}
  .switch-line a{color:var(--teal);font-weight:700;cursor:pointer;text-decoration:none;}
  .notice{padding:10px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px;}
  .notice.err{background:var(--rose-light);color:#8a2f2a;}
  .notice.ok{background:var(--teal-light);color:#1f5f59;}
  .notice.info{background:var(--amber-light);color:#8a6417;}

  /* recording box */
  .rec-box{border:1px dashed var(--line);border-radius:12px;padding:16px;background:#FAFBFC;}
  .transcript-box{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;min-height:60px;white-space:pre-wrap;line-height:1.6;}
  .transcript-box.placeholder{color:var(--ink-muted);}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .month-label{font-weight:700;font-size:16px;}
  .cal-nav{display:flex;gap:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11.5px;color:var(--ink-muted);font-weight:700;padding-bottom:4px;}
  .cal-cell{
    height:52px;border:1px solid var(--line);border-radius:9px;padding:6px;background:#FAFBFC;
    font-size:11.5px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .cal-cell.out{opacity:0.35;}
  .cal-cell.has-visits{cursor:pointer;border-color:var(--teal);background:var(--teal-light);}
  .cal-cell.has-visits:hover{opacity:0.85;}
  .cal-cell .d-num{font-family:var(--mono);font-size:11.5px;color:var(--ink-muted);}
  .day-count{
    background:var(--teal);color:#fff;border-radius:20px;padding:1px 8px;
    font-size:10.5px;font-weight:700;line-height:1.5;
  }

  .modal-bg{
    position:fixed;inset:0;background:rgba(15,20,35,0.5);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;
  }
  .modal{background:#fff;border-radius:16px;padding:24px;max-width:520px;width:100%;max-height:86vh;overflow:auto;}
  .modal h3{margin:0 0 4px;}
  .modal .close-x{float:right;cursor:pointer;color:var(--ink-muted);font-size:20px;line-height:1;}
  .feedback-item{background:#FAFBFC;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .feedback-item .meta{color:var(--ink-muted);font-size:11.5px;margin-bottom:4px;}

  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .pill{
    padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink-muted);
  }
  .pill.active-visit{background:var(--teal);color:#fff;border-color:var(--teal);}
  .pill.active-callback{background:var(--amber);color:#3a2c05;border-color:var(--amber);}
  .pill.active-declined{background:var(--rose);color:#fff;border-color:var(--rose);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;}
  .stat-box{flex:1;min-width:140px;background:#FAFBFC;border:1px solid var(--line);border-radius:10px;padding:14px;}
  .stat-box .num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--navy);}
  .stat-box .lbl{font-size:12px;color:var(--ink-muted);margin-top:2px;}

  .rank-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .rank-row:last-child{border-bottom:none;}
  .rank-row.me{background:var(--teal-light);border-radius:9px;}
  .rank-medal{width:26px;text-align:center;font-weight:700;color:var(--ink-muted);flex-shrink:0;}
  .rank-name{flex:1;font-weight:600;}
  .rank-score{font-family:var(--mono);font-weight:700;color:var(--navy);flex-shrink:0;}

  .key-note{font-size:12px;color:var(--ink-muted);background:#FAFBFC;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:14px;line-height:1.6;}
  .footnote{font-size:11.5px;color:var(--ink-muted);margin-top:6px;}
  .today-banner{
    display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#fff4e0,#fff9ef);
    border:1px solid var(--amber);border-radius:12px;padding:14px 18px;margin-bottom:18px;
    font-size:14px;font-weight:700;color:#8a6417;
  }
  .today-banner .icon{font-size:20px;}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====== Supabase 연결 설정 ======
   아래 두 값을 본인의 Supabase 프로젝트 값으로 반드시 교체하세요.
   Supabase 대시보드 > Project Settings > API 에서 확인 가능합니다. */
const SUPABASE_URL = 'https://bmkfqdznnyoidsfwyfhl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MVuWLSUX_Vqv9D0f25VSZw_ChDXQLh3';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- storage helpers (Supabase 기반) ---------- */
async function loadUsers(){
  try{
    const { data, error } = await supabaseClient.from('pp_users').select('*');
    if(error) throw error;
    return (data||[]).map(r=>({
      id:r.id, name:r.name, team:r.team, phone:r.phone, password:r.password,
      role:r.role, status:r.status, joinedAt:Number(r.joined_at), callCount:r.call_count||0
    }));
  }catch(e){ console.error('loadUsers error', e); return []; }
}
async function saveUsers(list){
  try{
    const rows = list.map(u=>({
      id:u.id, name:u.name, team:u.team, phone:u.phone, password:u.password,
      role:u.role, status:u.status, joined_at:u.joinedAt, call_count:u.callCount||0
    }));
    const { error } = await supabaseClient.from('pp_users').upsert(rows, { onConflict:'id' });
    if(error) throw error;
  }catch(e){ console.error('saveUsers error', e); }
}
async function loadCalls(){
  try{
    const { data, error } = await supabaseClient.from('pp_calls').select('*');
    if(error) throw error;
    return (data||[]).map(r=>({
      id:r.id, userId:r.user_id, userName:r.user_name, team:r.team,
      createdAt:Number(r.created_at), transcript:r.transcript,
      outcome:r.outcome, visitDate:r.visit_date, feedback:r.feedback||[], audioUrl:r.audio_url||null,
      customerName:r.customer_name||null, customerPhone:r.customer_phone||null
    }));
  }catch(e){ console.error('loadCalls error', e); return []; }
}
async function saveCalls(list){
  try{
    const rows = list.map(c=>({
      id:c.id, user_id:c.userId, user_name:c.userName, team:c.team,
      created_at:c.createdAt, transcript:c.transcript,
      outcome:c.outcome, visit_date:c.visitDate, feedback:c.feedback||[], audio_url:c.audioUrl||null,
      customer_name:c.customerName||null, customer_phone:c.customerPhone||null
    }));
    const { error } = await supabaseClient.from('pp_calls').upsert(rows, { onConflict:'id' });
    if(error) throw error;
  }catch(e){ console.error('saveCalls error', e); }
}
async function loadSession(){
  try{ return localStorage.getItem('pp_session'); }catch(e){ return null; }
}
async function saveSession(userId){
  try{
    if(userId===null){ localStorage.removeItem('pp_session'); }
    else{ localStorage.setItem('pp_session', userId); }
  }catch(e){ console.error('saveSession error', e); }
}
async function loadSharedSetting(key){
  try{
    const { data, error } = await supabaseClient.from('pp_settings').select('*').eq('id', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : '';
  }catch(e){ console.error('loadSharedSetting error', e); return ''; }
}
async function saveSharedSetting(key, value){
  try{
    const { error } = await supabaseClient.from('pp_settings').upsert({ id:key, value }, { onConflict:'id' });
    if(error) throw error;
  }catch(e){ console.error('saveSharedSetting error', e); }
}

/* ---------- activity process storage ---------- */
async function loadMissions(){
  try{
    const { data, error } = await supabaseClient.from('pp_missions').select('*').order('created_at', { ascending:true });
    if(error) throw error;
    return (data||[]).map(r=>({
      id:r.id, title:r.title, target:r.target, unit:r.unit, description:r.description,
      active: r.active!==false, createdAt:Number(r.created_at),
      proofType: r.proof_type || 'photo', minPhotos: r.min_photos||1, minDurationSec: r.min_duration_sec||0,
      mode: r.completion_mode || (r.proof_type==='audio' ? 'count' : 'batch')
    }));
  }catch(e){ console.error('loadMissions error', e); return []; }
}
async function saveMissionsAll(list){
  try{
    const rows = list.map(m=>({
      id:m.id, title:m.title, target:m.target, unit:m.unit, description:m.description,
      active:m.active, created_at:m.createdAt,
      proof_type:m.proofType||'photo', min_photos:m.minPhotos||0, min_duration_sec:m.minDurationSec||0,
      completion_mode: m.mode || (m.proofType==='audio' ? 'count' : 'batch')
    }));
    const { error } = await supabaseClient.from('pp_missions').upsert(rows, { onConflict:'id' });
    if(error) throw error;
  }catch(e){ console.error('saveMissionsAll error', e); }
}
async function deleteMissionFromDb(id){
  try{
    const { error } = await supabaseClient.from('pp_missions').delete().eq('id', id);
    if(error) throw error;
    return true;
  }catch(e){ console.error('deleteMissionFromDb error', e); alert('삭제 실패: '+e.message); return false; }
}
async function loadProofs(){
  try{
    const { data, error } = await supabaseClient.from('pp_activity_proofs').select('*').order('created_at', { ascending:false });
    if(error) throw error;
    return (data||[]).map(r=>({
      id:r.id, missionId:r.mission_id, userId:r.user_id, userName:r.user_name, team:r.team,
      photoUrls: r.photo_urls || [], audioUrl: r.audio_url || null, durationSec: r.duration_sec || null,
      quantity:r.quantity||1, note:r.note, status:r.status||'pending',
      createdAt:Number(r.created_at)
    }));
  }catch(e){ console.error('loadProofs error', e); return []; }
}
async function insertProof(proof){
  try{
    const row = {
      id:proof.id, mission_id:proof.missionId, user_id:proof.userId, user_name:proof.userName, team:proof.team,
      photo_urls:proof.photoUrls||[], audio_url:proof.audioUrl||null, duration_sec:proof.durationSec||null,
      quantity:proof.quantity, note:proof.note, status:proof.status, created_at:proof.createdAt
    };
    const { error } = await supabaseClient.from('pp_activity_proofs').insert([row]);
    if(error) throw error;
    return true;
  }catch(e){ console.error('insertProof error', e); alert('인증 등록 실패: '+e.message); return false; }
}
async function updateProofStatus(id, status){
  try{
    const { error } = await supabaseClient.from('pp_activity_proofs').update({ status }).eq('id', id);
    if(error) throw error;
    return true;
  }catch(e){ console.error('updateProofStatus error', e); alert('처리 실패: '+e.message); return false; }
}
async function loadRewards(){
  try{
    const { data, error } = await supabaseClient.from('pp_mission_rewards').select('*');
    if(error) throw error;
    return (data||[]).map(r=>({ id:r.id, missionId:r.mission_id, userId:r.user_id, rewardedAt:Number(r.rewarded_at) }));
  }catch(e){ console.error('loadRewards error', e); return []; }
}
async function insertReward(missionId, userId){
  try{
    const row = { id: uid('rw'), mission_id:missionId, user_id:userId, rewarded_at: Date.now() };
    const { error } = await supabaseClient.from('pp_mission_rewards').insert([row]);
    if(error) throw error;
    return { id:row.id, missionId, userId, rewardedAt:row.rewarded_at };
  }catch(e){ console.error('insertReward error', e); alert('처리 실패: '+e.message); return null; }
}
async function deleteReward(rewardId){
  try{
    const { error } = await supabaseClient.from('pp_mission_rewards').delete().eq('id', rewardId);
    if(error) throw error;
    return true;
  }catch(e){ console.error('deleteReward error', e); return false; }
}
async function uploadPhotoToStorage(file){
  const path = `${uid('photo')}${safeFileExt(file.name)}`;
  const { error } = await supabaseClient.storage.from('activity-photos').upload(path, file, {
    contentType: file.type || 'image/jpeg', upsert:false
  });
  if(error) throw error;
  const { data } = supabaseClient.storage.from('activity-photos').getPublicUrl(path);
  return data.publicUrl;
}
async function uploadActivityAudioToStorage(file){
  const path = `${uid('actaudio')}${safeFileExt(file.name)}`;
  const { error } = await supabaseClient.storage.from('call-recordings').upload(path, file, {
    contentType: file.type || 'audio/mpeg', upsert:false
  });
  if(error) throw error;
  const { data } = supabaseClient.storage.from('call-recordings').getPublicUrl(path);
  return data.publicUrl;
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function isStoreAccount(u){ return !!u && /^p\d{6}$/.test(u.name||''); }
function personalTrainees(){ return STATE.users.filter(u=>u.role!=='admin' && u.status==='approved' && !isStoreAccount(u)); }
function storeTrainees(){ return STATE.users.filter(u=>u.role!=='admin' && u.status==='approved' && isStoreAccount(u)); }

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  STATE.users = await loadUsers();

  STATE.aiSharedKey = await loadSharedSetting('gemini_api_key');
  STATE.missions = await loadMissions();
  STATE.proofs = await loadProofs();

/* ================= ACTIVITY PROCESS (외부활동) ================= */
function missionProgress(missionId, userId){
  const now = new Date();
  return STATE.proofs.filter(p=>{
    if(p.missionId!==missionId || p.userId!==userId || p.status!=='approved') return false;
    const d = new Date(p.createdAt);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).reduce((sum,p)=>sum+(p.quantity||1),0);
}
function getReward(missionId, userId){
  const now = new Date();
  const key = `${now.getFullYear()}-${now.getMonth()}`;
  return STATE.rewards.find(r=>{
    if(r.missionId!==missionId || r.userId!==userId) return false;
    const d = new Date(r.rewardedAt);
    return `${d.getFullYear()}-${d.getMonth()}`===key;
  });
}

  if(!id) return '';
  const m = STATE.missions.find(x=>x.id===id);
  if(!m) return '';
  const isAudio = m.proofType==='audio';
  return `
  <div class="modal-bg" id="editMissionModalBg">
    <div class="modal">
      <span class="close-x" id="editMissionModalClose">×</span>
      <h3>미션 수정</h3>
      <label>미션 이름</label>
      <input type="text" id="editMissionTitleInput" value="${escapeHtml(m.title)}">
      <label>목표 수량</label>
      <input type="text" id="editMissionTargetInput" inputmode="numeric" value="${m.target}">
      <label>단위</label>
      <input type="text" id="editMissionUnitInput" value="${escapeHtml(m.unit)}">
      <label>인증 방식</label>
      <div class="pill-row">
        <div class="pill edit-mission-proof-pill ${!isAudio?'active-visit':''}" data-proof-type="photo">📷 사진</div>
        <div class="pill edit-mission-proof-pill ${isAudio?'active-visit':''}" data-proof-type="audio">🎙️ 녹취파일</div>
      </div>
      <div id="editPhotoProofFields" style="${isAudio?'display:none;':''}">
        <label>최소 사진 장수</label>
        <input type="text" id="editMissionMinPhotosInput" inputmode="numeric" value="${m.minPhotos||1}">
      </div>
      <div id="editAudioProofFields" style="${isAudio?'':'display:none;'}">
        <label>최소 통화 시간(초)</label>
        <input type="text" id="editMissionMinDurationInput" inputmode="numeric" value="${m.minDurationSec||60}">
      </div>
      <label>완료 방식</label>
      <div class="pill-row">
        <div class="pill edit-mission-mode-pill ${m.mode==='batch'?'active-visit':''}" data-mode="batch">✅ 제출 1회 + 승인 시 즉시 완료</div>
      </div>
      <div class="pill-row">
        <div class="pill edit-mission-mode-pill ${m.mode==='count'?'active-visit':''}" data-mode="count">🔢 제출·승인마다 1건씩 누적</div>
      </div>
      <label>설명 (선택)</label>
      <textarea id="editMissionDescInput">${escapeHtml(m.description||'')}</textarea>
      <div class="btn-row"><button class="btn teal" id="saveMissionEditBtn">저장</button></div>
    </div>
  </div>`;
}
function openMissionEditModal(id){
  STATE.editMissionId = id;
  reopenMissionEditModal();
}
function reopenMissionEditModal(){
  const existing = document.getElementById('editMissionModalBg');
  if(existing) existing.remove();
  if(!STATE.editMissionId) return;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = renderMissionEditModal();
  if(!wrapper.firstElementChild) return;
  document.body.appendChild(wrapper.firstElementChild);
  document.getElementById('editMissionModalClose').onclick = closeMissionEditModal;
  document.getElementById('editMissionModalBg').onclick = (e)=>{ if(e.target.id==='editMissionModalBg') closeMissionEditModal(); };
  document.querySelectorAll('.edit-mission-proof-pill').forEach(p=>{
    p.onclick = ()=>{
      document.querySelectorAll('.edit-mission-proof-pill').forEach(x=>x.classList.remove('active-visit'));
      p.classList.add('active-visit');
      const type = p.getAttribute('data-proof-type');
      document.getElementById('editPhotoProofFields').style.display = type==='photo' ? '' : 'none';
      document.getElementById('editAudioProofFields').style.display = type==='audio' ? '' : 'none';
    };
  });
  document.querySelectorAll('.edit-mission-mode-pill').forEach(p=>{
    p.onclick = ()=>{
      document.querySelectorAll('.edit-mission-mode-pill').forEach(x=>x.classList.remove('active-visit'));
      p.classList.add('active-visit');
    };
  });
  document.getElementById('saveMissionEditBtn').onclick = saveMissionEdit;
}
function closeMissionEditModal(){
  const m = document.getElementById('editMissionModalBg');
  if(m) m.remove();
  STATE.editMissionId = null;
}
async function saveMissionEdit(){
  const m = STATE.missions.find(x=>x.id===STATE.editMissionId);
  if(!m) return;
  const title = (document.getElementById('editMissionTitleInput').value||'').trim();
  const target = parseInt(document.getElementById('editMissionTargetInput').value,10);
  const unit = (document.getElementById('editMissionUnitInput').value||'').trim() || '개';
  const description = (document.getElementById('editMissionDescInput').value||'').trim();
  const proofTypeEl = document.querySelector('.edit-mission-proof-pill.active-visit');
  const proofType = proofTypeEl ? proofTypeEl.getAttribute('data-proof-type') : 'photo';
  const modeEl = document.querySelector('.edit-mission-mode-pill.active-visit');
  const mode = modeEl ? modeEl.getAttribute('data-mode') : 'batch';
  const minPhotos = proofType==='photo' ? (parseInt(document.getElementById('editMissionMinPhotosInput').value,10)||1) : 0;
  const minDurationSec = proofType==='audio' ? (parseInt(document.getElementById('editMissionMinDurationInput').value,10)||0) : 0;
  if(!title){ alert('미션 이름을 입력해주세요.'); return; }
  if(!target || target<=0){ alert('목표 수량을 숫자로 입력해주세요.'); return; }
  m.title = title; m.target = target; m.unit = unit; m.description = description;
  m.proofType = proofType; m.minPhotos = minPhotos; m.minDurationSec = minDurationSec; m.mode = mode;
  await saveMissionsAll(STATE.missions);
  closeMissionEditModal();
  render();
}

    return `

      <button class="btn ghost sm" id="activityBackUser">‹ 목록으로</button>

    </div>
    <div class="card">
      ${STATE.missions.length===0 ? `<div class="empty">등록된 미션이 없습니다.</div>` : STATE.missions.map(m=>{
        const prog = missionProgress(m.id, user.id);

  if(!missionId) return '';

  const ss = STATE.submitState;
  const isAudio = m.proofType==='audio';
  return `
  <div class="modal-bg" id="submitModalBg">
    <div class="modal">
      <span class="close-x" id="submitModalClose">×</span>
      <h3>${escapeHtml(m.title)} 인증</h3>
      <div class="sub">목표 ${m.target}${escapeHtml(m.unit)} · 인증: ${isAudio?`녹취파일 (${m.minDurationSec}초 이상)`:`사진 ${m.minPhotos}장 이상`}</div>
      ${isAudio ? `
        <label>녹취 파일 업로드</label>
        <input type="file" id="proofAudioInput" accept="audio/*">
        ${ss.audioFile ? `<div class="footnote">선택된 파일: ${escapeHtml(ss.audioFile.name)} ${ss.audioDuration!=null?`· ${Math.round(ss.audioDuration)}초`:''} ${ss.uploading?'· 업로드 중...':(ss.audioUrl?'· 업로드 완료 ✓':'')}</div>` : ''}
        ${ss.audioDuration!=null && ss.audioDuration < m.minDurationSec ? `<div class="footnote" style="color:var(--rose);">⚠️ ${m.minDurationSec}초 이상인 통화만 인증 가능해요.</div>` : ''}
      ` : `
        <label>인증 사진 (${m.minPhotos}장 이상 선택)</label>
        <input type="file" id="proofPhotoInput" accept="image/*" multiple>
        ${ss.photoFiles.length>0 ? `<div class="footnote">선택된 사진: ${ss.photoFiles.length}장 ${ss.uploading?'· 업로드 중...':(ss.photoUrls.length===ss.photoFiles.length?'· 업로드 완료 ✓':'')}</div>` : ''}
        ${ss.photoFiles.length>0 && ss.photoFiles.length<m.minPhotos ? `<div class="footnote" style="color:var(--rose);">⚠️ 최소 ${m.minPhotos}장 이상 첨부해야 해요.</div>` : ''}
      `}
      <div class="footnote">${m.mode==='batch' ? `이 미션은 이 제출 1건이 관리자 승인되면 바로 완료돼요.` : `이 미션은 승인될 때마다 1건씩 누적돼요. (목표 ${m.target}${escapeHtml(m.unit)})`}</div>
      <label>메모 (선택)</label>
      <textarea id="proofNoteInput" placeholder="메모를 입력하세요">${escapeHtml(ss.note)}</textarea>
      <div class="btn-row"><button class="btn teal" id="submitProofBtn" ${ss.uploading?'disabled':''}>${ss.uploading?'업로드 중...':'제출하기'}</button></div>
    </div>
  </div>`;
}
function openSubmitModal(missionId){
  STATE.activitySubmitMissionId = missionId;
  STATE.submitState = { photoFiles:[], photoUrls:[], audioFile:null, audioUrl:null, audioDuration:null, uploading:false, quantity:1, note:'' };
  reopenSubmitModal();
}
function reopenSubmitModal(){
  const existing = document.getElementById('submitModalBg');
  if(existing) existing.remove();
  if(!STATE.activitySubmitMissionId) return;
  const m = STATE.missions.find(x=>x.id===STATE.activitySubmitMissionId);
  if(!m) return;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = renderSubmitModal();
  if(!wrapper.firstElementChild) return;
  document.body.appendChild(wrapper.firstElementChild);
  document.getElementById('submitModalClose').onclick = closeSubmitModal;
  document.getElementById('submitModalBg').onclick = (e)=>{ if(e.target.id==='submitModalBg') closeSubmitModal(); };

  const photoInput = document.getElementById('proofPhotoInput');
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    if(files.length===0) return;
    for(const f of files){
      if(f.size > 8*1024*1024){ alert('사진 한 장당 용량은 8MB 이하여야 해요.'); return; }
    }
    STATE.submitState.photoFiles = files;
    STATE.submitState.photoUrls = [];
    STATE.submitState.uploading = true;
    reopenSubmitModal();
    try{
      const urls = [];
      for(const f of files){ urls.push(await uploadPhotoToStorage(f)); }
      STATE.submitState.photoUrls = urls;
    }catch(err){
      alert('업로드 실패: ' + err.message);
    }finally{
      STATE.submitState.uploading = false;
      reopenSubmitModal();
    }
  };

  const audioInput = document.getElementById('proofAudioInput');
  if(audioInput) audioInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 15*1024*1024){ alert('파일이 너무 큽니다 (15MB 이하로 올려주세요).'); e.target.value=''; return; }
    STATE.submitState.audioFile = file;
    STATE.submitState.uploading = true;
    reopenSubmitModal();
    try{
      STATE.submitState.audioDuration = await getAudioDurationFromFile(file).catch(()=>null);
      STATE.submitState.audioUrl = await uploadActivityAudioToStorage(file);
    }catch(err){
      alert('업로드 실패: ' + err.message);
    }finally{
      STATE.submitState.uploading = false;
      reopenSubmitModal();
    }
  };

  const noteInput = document.getElementById('proofNoteInput');
  noteInput.oninput = (e)=>{ STATE.submitState.note = e.target.value; };
  document.getElementById('submitProofBtn').onclick = submitProof;
}
function closeSubmitModal(){
  const m = document.getElementById('submitModalBg');
  if(m) m.remove();
  STATE.activitySubmitMissionId = null;
}
async function submitProof(){
  const u = currentUser();
  const ss = STATE.submitState;
  const m = STATE.missions.find(x=>x.id===STATE.activitySubmitMissionId);
  if(!m) return;
  const isAudio = m.proofType==='audio';
  if(isAudio){
    if(!ss.audioUrl){ alert('녹취 파일을 업로드해주세요.'); return; }
    if(ss.audioDuration!=null && ss.audioDuration < m.minDurationSec){
      alert(`${m.minDurationSec}초 이상인 통화만 인증할 수 있어요.`);
      return;
    }
  }else{
    if(ss.photoUrls.length===0){ alert('인증 사진을 업로드해주세요.'); return; }
    if(ss.photoUrls.length < m.minPhotos){ alert(`최소 ${m.minPhotos}장 이상의 사진이 필요해요.`); return; }
  }
  const qty = m.mode==='batch' ? m.target : 1;
  const proof = {
    id: uid('proof'), missionId: m.id, userId:u.id, userName:u.name, team:u.team,
    photoUrls: isAudio ? [] : ss.photoUrls,
    audioUrl: isAudio ? ss.audioUrl : null,
    durationSec: isAudio ? Math.round(ss.audioDuration||0) : null,
    quantity: qty, note: ss.note||'', status:'pending', createdAt: Date.now()
  };
  const ok = await insertProof(proof);
  if(!ok) return;
  STATE.proofs.unshift(proof);
  closeSubmitModal();
  render();
  alert('인증이 제출되었습니다. 관리자 승인을 기다려주세요.');
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function monthlyCallCount(userId){
  const now = new Date();
  return STATE.calls.filter(c=>{
    if(c.userId!==userId) return false;
    const d = new Date(c.createdAt);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).length;
}
function monthlyVisitConfirmedCount(userId){
  const now = new Date();
  return STATE.calls.filter(c=>{
    if(c.userId!==userId || c.outcome!=='visit_confirmed') return false;
    const d = new Date(c.createdAt);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).length;
}
function outcomeBadge(o){
  if(o==='visit_confirmed') return '<span class="badge visit">내방 확정</span>';
  if(o==='callback') return '<span class="badge callback">재통화 필요</span>';
  return '<span class="badge declined">거절</span>';
}
function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ================= CALENDAR ================= */
function renderCalendar(u){
  if(!STATE.calGroupFilter){
    STATE.calGroupFilter = u.role==='admin' ? 'all' : (teamGroup(u.team) || 'all');
    STATE.calTeamFilter = 'all';
  }
  const now = new Date();
  now.setMonth(now.getMonth()+STATE.calMonthOffset);
  const year = now.getFullYear(), month = now.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();

  const visits = STATE.calls.filter(c=>c.outcome==='visit_confirmed' && c.visitDate);
  let scoped = visits;
  if(STATE.calGroupFilter !== 'all'){
    scoped = scoped.filter(v=>teamGroup(v.team)===STATE.calGroupFilter);
  }
  if(STATE.calTeamFilter !== 'all'){
    scoped = scoped.filter(v=>v.team===STATE.calTeamFilter);
  }

  const teamOptions = STATE.calGroupFilter==='all'
    ? GROUP_NAMES.flatMap(g=>GROUPS[g])
    : GROUPS[STATE.calGroupFilter] || [];

  let cells = [];
  for(let i=0;i<startWeekday;i++){
    cells.push({d: prevDays-startWeekday+i+1, out:true});
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({d, out:false, dateStr: `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  }
  while(cells.length % 7 !==0){ cells.push({d: cells.length, out:true}); }

  const monthLabel = now.toLocaleDateString('ko-KR',{year:'numeric',month:'long'});

  return `
  <div class="card">
    <div class="cal-head">
      <div class="month-label">${monthLabel}</div>
      <div class="cal-nav">
        <button class="btn ghost sm" id="calPrev">‹ 이전</button>
        <button class="btn ghost sm" id="calNext">다음 ›</button>
      </div>
    </div>
    <label>그룹</label>
    <select id="calGroupSelect">
      <option value="all" ${STATE.calGroupFilter==='all'?'selected':''}>전체 그룹</option>
      ${GROUP_NAMES.map(g=>`<option value="${g}" ${STATE.calGroupFilter===g?'selected':''}>${g}</option>`).join('')}
    </select>
    <label>팀</label>
    <select id="calTeamSelect">
      <option value="all" ${STATE.calTeamFilter==='all'?'selected':''}>전체 팀</option>
      ${teamOptions.map(t=>`<option value="${t}" ${STATE.calTeamFilter===t?'selected':''}>${t}</option>`).join('')}
    </select>
    <div class="sub" style="margin-top:12px;">날짜를 클릭하면 팀별·담당자별 내방 예정 건수를 확인할 수 있어요.</div>
    <div class="cal-grid">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(cell=>{
        if(cell.out) return `<div class="cal-cell out"><div class="d-num">${cell.d}</div></div>`;
        const dayVisits = scoped.filter(v=>v.visitDate===cell.dateStr);
        const cnt = dayVisits.length;
        return `<div class="cal-cell ${cnt>0?'has-visits':''}" ${cnt>0?`data-open-day="${cell.dateStr}"`:''}>
          <div class="d-num">${cell.d}</div>
          ${cnt>0 ? `<div class="day-count">${cnt}건</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderDayModal(){
  const dateStr = STATE.calDetailDate;
  if(!dateStr) return '';
  const u = currentUser();
  let visits = STATE.calls.filter(c=>c.outcome==='visit_confirmed' && c.visitDate===dateStr);
  if(STATE.calGroupFilter && STATE.calGroupFilter!=='all'){
    visits = visits.filter(v=>teamGroup(v.team)===STATE.calGroupFilter);
  }
  if(STATE.calTeamFilter && STATE.calTeamFilter!=='all'){
    visits = visits.filter(v=>v.team===STATE.calTeamFilter);
  }

  const byTeam = {};
  visits.forEach(v=>{ (byTeam[v.team] = byTeam[v.team]||[]).push(v); });
  const byUser = {};
  visits.forEach(v=>{ (byUser[v.userName] = byUser[v.userName]||[]).push(v); });

  const renderGroup = (groups)=> Object.entries(groups).map(([name, list])=>`
    <div class="feedback-item">
      <div class="meta" style="font-weight:700;color:var(--ink);font-size:13px;">${name} · ${list.length}건</div>
      ${list.map(v=>`<div style="font-size:12.5px;color:var(--teal);cursor:pointer;margin-top:2px;" data-open-call-from-day="${v.id}">· ${v.userName} (${v.team}) — 고객: ${escapeHtml(v.customerName||'-')} / ${escapeHtml(v.customerPhone||'-')}</div>`).join('')}
    </div>`).join('');

  return `
  <div class="modal-bg" id="dayModalBg">
    <div class="modal">
      <span class="close-x" id="dayModalClose">×</span>
      <h3>${dateStr}</h3>
      <div class="sub">내방 예정 총 <b>${visits.length}건</b></div>

      <label>팀별 내방예정건</label>
      ${Object.keys(byTeam).length===0 ? `<div class="muted" style="font-size:13px;margin-bottom:10px;">예정된 내방이 없습니다.</div>` : renderGroup(byTeam)}

      <label>담당자별 내방예정건</label>
      ${Object.keys(byUser).length===0 ? `<div class="muted" style="font-size:13px;">예정된 내방이 없습니다.</div>` : renderGroup(byUser)}
    </div>
  </div>`;
}

function renderCallModal(){
  const call = STATE.calls.find(c=>c.id===STATE.modalCallId);
  if(!call) return '';
  const u = currentUser();
  const canDelete = u && (u.role==='admin' || u.id===call.userId);
  return `
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <span class="close-x" id="modalClose">×</span>
      <h3>${call.userName} · ${call.team}</h3>
      <div class="sub">${new Date(call.createdAt).toLocaleString('ko-KR')} ${outcomeBadge(call.outcome)}</div>
      ${call.visitDate ? `<div class="sub" style="margin-top:-8px;">내방 예정일: <b>${call.visitDate}</b></div>` : ''}
      ${call.customerName || call.customerPhone ? `<div class="sub" style="margin-top:-8px;">고객: <b>${escapeHtml(call.customerName||'-')}</b> · <b>${escapeHtml(call.customerPhone||'-')}</b></div>` : ''}
      ${call.audioUrl ? `
        <label>녹취 파일</label>
        <audio controls style="width:100%;" src="${call.audioUrl}"></audio>
        ${STATE.aiSharedKey ? `
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn ghost sm" id="analyzeSavedBtn" ${STATE.aiAnalyzing? 'disabled':''}>${STATE.aiAnalyzing? '분석 중...' : '🤖 AI로 분석하기'}</button>
          </div>
        ` : ''}
        ${STATE.aiNote ? `<div class="notice info" style="margin-top:10px;">${escapeHtml(STATE.aiNote)}</div>` : ''}
      ` : ''}
      <label>녹취 텍스트</label>
      <div class="transcript-box">${escapeHtml(call.transcript)||'(녹취 텍스트 없음, AI로 분석하거나 직접 입력해주세요)'}</div>
      ${call.outcome==='visit_confirmed' ? `
        <label>피드백</label>
        ${(call.feedback||[]).length===0 ? `<div class="muted" style="font-size:13px;margin-bottom:8px;">등록된 피드백이 없습니다.</div>` :
          call.feedback.map(f=>`<div class="feedback-item"><div class="meta">${f.author} · ${new Date(f.at).toLocaleString('ko-KR')}</div>${escapeHtml(f.text)}</div>`).join('')}
        <textarea id="feedbackInput" placeholder="피드백을 입력하세요"></textarea>
        <div class="btn-row"><button class="btn teal" id="addFeedbackBtn">피드백 등록</button></div>
      ` : ''}
      ${canDelete ? `<div class="btn-row"><button class="btn rose" id="deleteCallBtn">이 콜 기록 삭제</button></div>` : ''}
    </div>
  </div>`;
}

/* ================= EVENTS ================= */
function bindEvents(){
  const app = document.getElementById('app');

  const goSignup = document.getElementById('goSignup');
  if(goSignup) goSignup.onclick = ()=>{ STATE.view='signup'; STATE.authError=''; render(); };
  const goLogin = document.getElementById('goLogin');
  if(goLogin) goLogin.onclick = ()=>{ STATE.view='login'; STATE.authError=''; render(); };

  const suGroupEl = document.getElementById('suGroup');
  if(suGroupEl){
    suGroupEl.onchange = (e)=>{
      const teamSel = document.getElementById('suTeam');
      if(teamSel){
        teamSel.innerHTML = GROUPS[e.target.value].map(t=>`<option value="${t}">${t}</option>`).join('');
      }
    };
  }

  const loginForm = document.getElementById('loginForm');
  if(loginForm) loginForm.onsubmit = async (e)=>{
    e.preventDefault();
    let name = document.getElementById('loginName').value.trim();
    let pw = document.getElementById('loginPw').value;
    if(/^p\d{6}$/i.test(name)){
      // 매장(P코드) 계정은 대소문자 실수를 방지하기 위해 소문자로 통일해서 비교
      name = name.toLowerCase();
      pw = pw.toLowerCase();
    }
    const pwHash = await hashPassword(pw);
    let u = STATE.users.find(x=>x.name===name && x.password===pwHash);
    if(!u){
      // 이전 평문 비밀번호 계정과의 호환 처리: 맞으면 로그인 허용 후 자동으로 해시로 업그레이드
      const legacy = STATE.users.find(x=>x.name===name && x.password===pw);
      if(legacy){
        legacy.password = pwHash;
        await saveUsers(STATE.users);
        u = legacy;
      }
    }
    if(!u){ STATE.authError='이름 또는 비밀번호가 일치하지 않습니다.'; render(); return; }
    STATE.currentUserId = u.id;
    STATE.authError=''; STATE.authInfo='';
    await saveSession(u.id);
    STATE.view = (u.role==='admin' || u.status==='approved') ? 'home' : 'pending';
    render();
  };

  const signupForm = document.getElementById('signupForm');
  if(signupForm) signupForm.onsubmit = async (e)=>{
    e.preventDefault();
    const name = document.getElementById('suName').value.trim();
    const team = document.getElementById('suTeam').value;
    const phone = document.getElementById('suPhone').value.trim();
    const pw = document.getElementById('suPw').value;
    if(pw.length<4){ STATE.authError='비밀번호는 4자 이상이어야 합니다.'; render(); return; }
    if(STATE.users.some(u=>u.name===name)){ STATE.authError='이미 존재하는 이름입니다.'; render(); return; }
    const pwHash = await hashPassword(pw);
    const newUser = { id: uid('u'), name, team, phone, password:pwHash, role:'trainee', status:'pending', joinedAt: Date.now(), callCount:0 };
    STATE.users.push(newUser);
    await saveUsers(STATE.users);
    STATE.view='login'; STATE.authError='';
    STATE.authInfo='가입 요청이 접수되었습니다. 관리자 승인 후 로그인해주세요.';
    render();
  };

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = async ()=>{
    STATE.currentUserId = null;
    await saveSession(null);
    STATE.view='login';
    render();
  };

  const changePwBtn = document.getElementById('changePwBtn');
  if(changePwBtn) changePwBtn.onclick = openPasswordModal;

  const sidebarToggle = document.getElementById('sidebarToggle');
  if(sidebarToggle) sidebarToggle.onclick = ()=>{ STATE.sidebarOpen = true; render(); };
  const sidebarClose = document.getElementById('sidebarClose');
  if(sidebarClose) sidebarClose.onclick = ()=>{ STATE.sidebarOpen = false; render(); };
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  if(sidebarBackdrop) sidebarBackdrop.onclick = ()=>{ STATE.sidebarOpen = false; render(); };

  app.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = ()=>{
      STATE.view = btn.getAttribute('data-nav');
      STATE.adminViewGroup = null;
      STATE.adminViewUserId = null;
      STATE.activityViewUserId = null;
      STATE.sidebarOpen = false;
      render();
    };
  });

  app.querySelectorAll('[data-approve]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-approve');
      const u = STATE.users.find(x=>x.id===id);
      if(u){ u.status='approved'; await saveUsers(STATE.users); render(); }
    };
  });
  app.querySelectorAll('[data-reject]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-reject');
      const u = STATE.users.find(x=>x.id===id);
      if(u){ u.status='rejected'; await saveUsers(STATE.users); render(); }
    };
  });

  /* audio file upload */
  const audioFileInput = document.getElementById('audioFileInput');
  if(audioFileInput) audioFileInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 15*1024*1024){
      alert('파일이 너무 큽니다. 15MB 이하의 녹음 파일로 업로드해주세요.');
      e.target.value = '';
      return;
    }
    STATE.recState.audioFileName = file.name;
    STATE.recState.audioUploading = true;
    render();
    try{
      const base64 = await readFileAsBase64(file);
      STATE.recState.audioBase64 = base64;
      STATE.recState.audioMime = resolveAudioMime(file);
      try{
        STATE.recState.audioDuration = await getAudioDurationFromFile(file);
      }catch(durErr){
        STATE.recState.audioDuration = null;
      }
      await uploadAudioToStorage(file); // wait for upload so it's guaranteed saved with the record
    }catch(err){
      STATE.recState.audioUploading = false;
      render();
      alert('파일을 읽는 중 오류가 발생했습니다: ' + err.message);
    }
  };

  const transcriptEdit = document.getElementById('transcriptEdit');
  if(transcriptEdit){
    transcriptEdit.oninput = (e)=>{ STATE.recState.transcript = e.target.value; };
    transcriptEdit.onblur = ()=>{
      if(STATE.aiSharedKey && (STATE.recState.transcript||'').trim() && !STATE.aiAnalyzing){
        analyzeTranscriptWithAI();
      }
    };
  }

  const aiAnalyzeBtn = document.getElementById('aiAnalyzeBtn');
  if(aiAnalyzeBtn) aiAnalyzeBtn.onclick = ()=>{
    if(STATE.recState.audioBase64){ analyzeAudioWithAI(); }
    else{ analyzeTranscriptWithAI(); }
  };

  const saveAiKeyBtn = document.getElementById('saveAiKeyBtn');
  if(saveAiKeyBtn) saveAiKeyBtn.onclick = async ()=>{
    const val = (document.getElementById('sharedAiKeyInput').value||'').trim();
    await saveSharedSetting('gemini_api_key', val);
    STATE.aiSharedKey = val;
    render();
  };

  app.querySelectorAll('[data-outcome]').forEach(p=>{
    p.onclick = ()=>{ STATE.recState.outcome = p.getAttribute('data-outcome'); render(); };
  });
  const visitDateInput = document.getElementById('visitDateInput');
  if(visitDateInput) visitDateInput.onchange = (e)=>{ STATE.recState.visitDate = e.target.value; };

  const custNameFirst = document.getElementById('custNameFirst');
  if(custNameFirst) custNameFirst.oninput = (e)=>{
    STATE.recState.custNameFirst = e.target.value.slice(0,1);
    const preview = e.target.parentElement.querySelector('.muted b');
    if(preview) preview.textContent = `${STATE.recState.custNameFirst||'?'}*${STATE.recState.custNameLast||'?'}`;
  };
  const custNameLast = document.getElementById('custNameLast');
  if(custNameLast) custNameLast.oninput = (e)=>{
    STATE.recState.custNameLast = e.target.value.slice(0,1);
    const preview = e.target.parentElement.querySelector('.muted b');
    if(preview) preview.textContent = `${STATE.recState.custNameFirst||'?'}*${STATE.recState.custNameLast||'?'}`;
  };
  const custPhoneLast4 = document.getElementById('custPhoneLast4');
  if(custPhoneLast4) custPhoneLast4.oninput = (e)=>{
    const digits = e.target.value.replace(/[^0-9]/g,'').slice(0,4);
    e.target.value = digits;
    STATE.recState.custPhoneLast4 = digits;
  };

  const saveCallBtn = document.getElementById('saveCallBtn');
  if(saveCallBtn) saveCallBtn.onclick = async ()=>{
    const u = currentUser();
    const rs = STATE.recState;
    if(!rs.audioBase64){
      alert('녹취 파일을 먼저 업로드해야 콜 기록을 저장할 수 있어요.');
      return;
    }
    if(rs.audioUploading){
      alert('녹취 파일 저장이 아직 끝나지 않았어요. 잠시만 기다려주세요.');
      return;
    }
    if(rs.outcome==='visit_confirmed'){
      if(!rs.visitDate){
        alert('내방 확정 건은 내방 예정일을 입력해주세요.');
        return;
      }
      if(!rs.custNameFirst || !rs.custNameLast){
        alert('내방 확정 건은 고객 이름(첫 글자·마지막 글자)을 입력해주세요.');
        return;
      }
      if(!rs.custPhoneLast4 || rs.custPhoneLast4.length!==4){
        alert('내방 확정 건은 고객 연락처 뒤 4자리를 입력해주세요.');
        return;
      }
    }
    const call = {
      id: uid('c'), userId:u.id, userName:u.name, team:u.team,
      createdAt: Date.now(), transcript: rs.transcript||'',
      outcome: rs.outcome, visitDate: rs.outcome==='visit_confirmed'? rs.visitDate : null,
      customerName: rs.outcome==='visit_confirmed' ? `${rs.custNameFirst}*${rs.custNameLast}` : null,
      customerPhone: rs.outcome==='visit_confirmed' ? `010-****-${rs.custPhoneLast4}` : null,
      feedback: [], audioUrl: rs.audioUrl || null
    };
    STATE.calls.push(call);
    await saveCalls(STATE.calls);
    u.callCount = (u.callCount||0)+1;
    await saveUsers(STATE.users);
    STATE.recState = { transcript:'', outcome:'visit_confirmed', visitDate:'', audioBase64:null, audioMime:null, audioFileName:'', audioUrl:null, audioUploading:false, audioDuration:null, custNameFirst:'', custNameLast:'', custPhoneLast4:'' };
    STATE.aiNote = '';
    render();
  };
  const clearCallBtn = document.getElementById('clearCallBtn');
  if(clearCallBtn) clearCallBtn.onclick = ()=>{
    STATE.recState = { transcript:'', outcome:'visit_confirmed', visitDate:'', audioBase64:null, audioMime:null, audioFileName:'', audioUrl:null, audioUploading:false, audioDuration:null, custNameFirst:'', custNameLast:'', custPhoneLast4:'' };
    STATE.aiNote = '';
    render();
  };

  /* calendar */
  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.onclick = ()=>{ STATE.calMonthOffset--; render(); };
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.onclick = ()=>{ STATE.calMonthOffset++; render(); };
  const calGroupSelect = document.getElementById('calGroupSelect');
  if(calGroupSelect) calGroupSelect.onchange = (e)=>{
    STATE.calGroupFilter = e.target.value;
    STATE.calTeamFilter = 'all';
    render();
  };
  const calTeamSelect = document.getElementById('calTeamSelect');
  if(calTeamSelect) calTeamSelect.onchange = (e)=>{
    STATE.calTeamFilter = e.target.value;
    render();
  };

  app.querySelectorAll('[data-open-call]').forEach(el=>{
    el.onclick = ()=>{
      STATE.modalCallId = el.getAttribute('data-open-call');
      openModal();
    };
  });

  app.querySelectorAll('[data-open-day]').forEach(el=>{
    el.onclick = ()=>{
      openDayModal(el.getAttribute('data-open-day'));
    };
  });

  app.querySelectorAll('[data-open-group]').forEach(el=>{
    el.onclick = ()=>{
      STATE.adminViewGroup = el.getAttribute('data-open-group');
      STATE.adminViewUserId = null;
      render();
    };
  });
  app.querySelectorAll('[data-open-user]').forEach(el=>{
    el.onclick = ()=>{
      STATE.adminViewUserId = el.getAttribute('data-open-user');
      render();
    };
  });
  const adminBackGroup = document.getElementById('adminBackGroup');
  if(adminBackGroup) adminBackGroup.onclick = ()=>{ STATE.adminViewGroup = null; render(); };
  const adminBackUser = document.getElementById('adminBackUser');
  if(adminBackUser) adminBackUser.onclick = ()=>{ STATE.adminViewUserId = null; render(); };

  /* ---- activity process bindings ---- */
  const addMissionBtn = document.getElementById('addMissionBtn');
  if(addMissionBtn) addMissionBtn.onclick = async ()=>{
    const title = (document.getElementById('missionTitleInput').value||'').trim();
    const target = parseInt(document.getElementById('missionTargetInput').value,10);
    const unit = (document.getElementById('missionUnitInput').value||'').trim() || '개';
    const description = (document.getElementById('missionDescInput').value||'').trim();
    const proofTypeEl = document.querySelector('.mission-proof-pill.active-visit');
    const proofType = proofTypeEl ? proofTypeEl.getAttribute('data-proof-type') : 'photo';
    const modeEl = document.querySelector('.mission-mode-pill.active-visit');
    const mode = modeEl ? modeEl.getAttribute('data-mode') : (proofType==='audio' ? 'count' : 'batch');
    const minPhotos = proofType==='photo' ? (parseInt(document.getElementById('missionMinPhotosInput').value,10)||1) : 0;
    const minDurationSec = proofType==='audio' ? (parseInt(document.getElementById('missionMinDurationInput').value,10)||0) : 0;
    if(!title){ alert('미션 이름을 입력해주세요.'); return; }
    if(!target || target<=0){ alert('목표 수량을 숫자로 입력해주세요.'); return; }
    const mission = { id: uid('mis'), title, target, unit, description, active:true, createdAt: Date.now(), proofType, minPhotos, minDurationSec, mode };
    STATE.missions.push(mission);
    await saveMissionsAll(STATE.missions);
    render();
  };
  app.querySelectorAll('.mission-proof-pill').forEach(p=>{
    p.onclick = ()=>{
      app.querySelectorAll('.mission-proof-pill').forEach(x=>x.classList.remove('active-visit'));
      p.classList.add('active-visit');
      const type = p.getAttribute('data-proof-type');
      const photoFields = document.getElementById('photoProofFields');
      const audioFields = document.getElementById('audioProofFields');
      if(photoFields) photoFields.style.display = type==='photo' ? '' : 'none';
      if(audioFields) audioFields.style.display = type==='audio' ? '' : 'none';
      // 인증 방식에 맞는 완료 방식 기본값 자동 선택
      app.querySelectorAll('.mission-mode-pill').forEach(x=>x.classList.remove('active-visit'));
      const suggested = type==='audio' ? 'count' : 'batch';
      const suggestedEl = app.querySelector(`.mission-mode-pill[data-mode="${suggested}"]`);
      if(suggestedEl) suggestedEl.classList.add('active-visit');
    };
  });
  app.querySelectorAll('.mission-mode-pill').forEach(p=>{
    p.onclick = ()=>{
      app.querySelectorAll('.mission-mode-pill').forEach(x=>x.classList.remove('active-visit'));
      p.classList.add('active-visit');
    };
  });
  app.querySelectorAll('[data-edit-mission]').forEach(btn=>{
    btn.onclick = ()=>{ openMissionEditModal(btn.getAttribute('data-edit-mission')); };
  });
  app.querySelectorAll('[data-toggle-mission]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-toggle-mission');
      const m = STATE.missions.find(x=>x.id===id);
      if(m){ m.active = !m.active; await saveMissionsAll(STATE.missions); render(); }
    };
  });
  app.querySelectorAll('[data-delete-mission]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('이 미션을 삭제하시겠습니까? 관련 인증 기록은 남아있지만 미션명이 사라져요.')) return;
      const id = btn.getAttribute('data-delete-mission');

async function deleteCallRecord(callId){
  const call = STATE.calls.find(c=>c.id===callId);
  if(!call) return false;
  try{
    const { error } = await supabaseClient.from('pp_calls').delete().eq('id', callId);
    if(error) throw error;
  }catch(e){
    console.error('deleteCallRecord error', e);
    alert('삭제에 실패했습니다: ' + e.message + '\n(Supabase의 pp_calls 테이블에 삭제 권한 정책이 있는지 확인해주세요)');
    return false;
  }
  if(call.audioUrl){
    try{
      const path = call.audioUrl.split('/call-recordings/')[1];
      if(path) await supabaseClient.storage.from('call-recordings').remove([path]);
    }catch(e){ console.error('audio delete error', e); }
  }
  STATE.calls = STATE.calls.filter(c=>c.id!==callId);
  return true;
}

/* ================= AUDIO FILE UPLOAD ================= */
function readFileAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getAudioDurationFromSrc(src){
  return new Promise((resolve, reject)=>{
    const audio = document.createElement('audio');
    audio.preload = 'metadata';
    audio.onloadedmetadata = ()=> resolve(audio.duration);
    audio.onerror = ()=> reject(new Error('오디오 길이를 확인할 수 없습니다.'));
    audio.src = src;
  });
}
function getAudioDurationFromFile(file){
  const url = URL.createObjectURL(file);
  return getAudioDurationFromSrc(url).then(
    d=>{ URL.revokeObjectURL(url); return d; },
    e=>{ URL.revokeObjectURL(url); throw e; }
  );
}

function safeFileExt(name){
  const m = /\.[a-zA-Z0-9]+$/.exec(name||'');
  return m ? m[0] : '';
}

async function uploadAudioToStorage(file){
  try{
    const path = `${uid('rec')}${safeFileExt(file.name)}`;
    const { error } = await supabaseClient.storage.from('call-recordings').upload(path, file, {
      contentType: file.type || 'audio/mpeg', upsert: false
    });
    if(error) throw error;
    const { data } = supabaseClient.storage.from('call-recordings').getPublicUrl(path);
    STATE.recState.audioUrl = data.publicUrl;
  }catch(e){
    console.error('uploadAudioToStorage error', e);
  }finally{
    STATE.recState.audioUploading = false;
    render();
  }
}

function resolveAudioMime(file){
  const name = (file.name||'').toLowerCase();
  const ext = name.includes('.') ? name.split('.').pop() : '';
  const extMap = {
    m4a:'audio/m4a', mp3:'audio/mp3', wav:'audio/wav', aac:'audio/aac',
    ogg:'audio/ogg', oga:'audio/ogg', flac:'audio/flac', webm:'audio/webm',
    mp4:'audio/mp4', mpga:'audio/mpga', mpeg:'audio/mpeg', mpa:'audio/m4a', aiff:'audio/aiff'
  };
  if(extMap[ext]) return extMap[ext];
  if(file.type && file.type.startsWith('audio/')) return file.type;
  return 'audio/mp4';
}
function resolveAudioMimeFromUrl(url){
  return resolveAudioMime({ name: (url||'').split('?')[0] });
}
function fetchUrlAsBase64(url){
  return fetch(url).then(res=>res.blob()).then(blob=>new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  }));
}

async function callGeminiAPI(key, parts, attempt){
  attempt = attempt || 1;
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=' + encodeURIComponent(key), {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts }] })
  });
  let data;
  try{ data = await res.json(); }catch(e){ throw new Error('서버 응답을 읽을 수 없습니다.'); }
  if(data.error){
    const msg = data.error.message || 'API 오류';
    const overloaded = res.status===503 || /overloaded|high demand|unavailable/i.test(msg);
    if(overloaded && attempt<4){
      await new Promise(r=>setTimeout(r, attempt*1500));
      return callGeminiAPI(key, parts, attempt+1);
    }
    throw new Error(msg);
  }
  const cand = (data.candidates||[])[0];
  const textPart = cand && cand.content && cand.content.parts && cand.content.parts[0];
  if(!textPart || !textPart.text){ throw new Error('AI 응답을 읽을 수 없습니다.'); }
  return textPart.text;
}

async function analyzeAudioWithAI(){
  const key = (STATE.aiSharedKey||'').trim();

  if(!STATE.recState.audioBase64){ alert('업로드된 녹음 파일이 없습니다.'); return; }

    return;
  }

  STATE.aiAnalyzing = true;
  STATE.aiNote = '재시도 포함 최대 몇 초 걸릴 수 있어요...';
  render();

  const prompt = `오늘 날짜는 ${todayStr()}입니다. 첨부된 오디오는 보험/금융 상담원이 고객과 나눈 전화 통화 녹음입니다.
다음을 수행하세요:
1) 통화 내용을 한국어 텍스트로 최대한 정확하게 받아적으세요.
2) 통화 내용을 분석해서 결과를 판단하세요.

아래 JSON 형식으로만 답변하세요. 다른 설명, 마크다운, 코드블록 없이 순수 JSON 한 줄만 출력하세요.
{"transcript": "받아적은 통화 전체 내용", "outcome": "visit_confirmed | callback | declined 중 하나", "visitDate": "내방 예정일이 있으면 YYYY-MM-DD, 없으면 null", "reason": "판단 근거를 한 문장으로 요약"}`;

  try{
    const text = await callGeminiAPI(key, [
      { text: prompt },
      { inline_data: { mime_type: STATE.recState.audioMime || 'audio/mp4', data: STATE.recState.audioBase64 } }
    ]);
    let raw = text.trim();
    raw = raw.replace(/^```json\s*|^```\s*|```$/g, '').trim();

    if(parsed.transcript){ STATE.recState.transcript = parsed.transcript; }
    if(['visit_confirmed','callback','declined'].includes(parsed.outcome)){
      STATE.recState.outcome = parsed.outcome;
    }
    if(parsed.visitDate && /^\d{4}-\d{2}-\d{2}$/.test(parsed.visitDate)){
      STATE.recState.visitDate = parsed.visitDate;
    }
    STATE.aiNote = 'AI 분석 결과: ' + (parsed.reason || '분석 완료') + ' (텍스트와 결과는 저장 전에 꼭 확인해주세요)';
  }catch(e){
    STATE.aiNote = 'AI 분석 실패: ' + e.message + ' (잠시 후 "다시 분석하기"를 눌러 재시도해보세요)';
  }finally{
    STATE.aiAnalyzing = false;
    render();
  }
}

    STATE.aiNote = 'AI 분석 결과: ' + (parsed.reason || '분석 완료') + ' (결과가 자동으로 반영되었어요. 필요하면 다시 확인해주세요)';
  }catch(e){
